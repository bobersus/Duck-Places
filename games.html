<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Duck Places - All Games</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Browse all Duck Places Roblox games." />
  <script src="/theme.js"></script>
  <script defer src="/effects.js"></script>
  <link rel="stylesheet" href="/design.css" />
  <link rel="stylesheet" href="/refinements.css" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script defer src="/script.js"></script>
  <script defer src="/assets/games-data.js"></script>
  <script defer src="/client.js"></script>
</head>
<body class="page">
  <!-- HEADER (тот же) -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="brand">
        <img src="assets/logo-duck-places.png" alt="Duck Places logo" class="brand-logo" />
        <span class="brand-text">Duck Places</span>
      </a>

      <nav class="main-nav" id="mainNav">
        <a href="/" class="nav-link">Home</a>
        <a href="/games" class="nav-link nav-link-active" aria-current="page">Games</a>
        <a href="/careers" class="nav-link">Careers</a>
        <a href="/#contact" class="nav-link nav-link-primary">Contact Us</a>
      </nav>

      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main>
    <section class="section section-white section-games-hero">
      <div class="container">
        <div class="section-header">
          <h1 class="section-title">Find your next favorite.</h1>
          <p class="section-subtitle">🤗 We create Roblox games to bring people together.</p>
        </div>
      </div>
    </section>

    <section class="section section-white">
      <div class="container">
        <div class="catalog-toolbar">
          <label class="search-wrap"><span class="sr-only">Search games</span><input id="gameSearch" type="search" placeholder="Find a game…" autocomplete="off" /></label>
          <label><span class="sr-only">Sort games</span><select id="gameSort"><option value="online">Most players online</option><option value="visits">Most visited</option><option value="name">Name A–Z</option><option value="newest" title="By Roblox experience creation date">Newest first</option><option value="oldest" title="By Roblox experience creation date">Oldest first</option></select></label>
          <span class="catalog-count" id="gameCount" aria-live="polite"></span>
        </div>
        <div class="games-grid" id="allGamesGrid">

        </div>
        <p class="games-status" role="status"></p>
      </div>
    </section>
  </main>

  <!-- FOOTER (тот же) -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <div class="footer-logo">
          <img src="assets/logo-duck-places.png" alt="Duck Places logo" />
        </div>
        <div>
          <div class="footer-title">Duck Places</div>
          <div class="footer-tagline">🤗 We create Roblox games to bring people together.</div>
        </div>
      </div>

      <div class="footer-links">
        <div class="footer-column">
          <h4>Company</h4>
          <a href="/#about">About Us</a>
          <a href="/#contact">Contact</a>
        </div>
        <div class="footer-column">
          <h4>Socials</h4>
          <a href="https://www.roblox.com/users/739163231/profile" target="_blank" rel="noopener noreferrer">Roblox</a>
          <a href="https://x.com/BoberSus" target="_blank" rel="noopener noreferrer">Twitter</a>
          <a href="https://discord.gg/cMs7w5RWD2" target="_blank" rel="noopener noreferrer">Discord</a>
        </div>
        <div class="footer-column">
          <h4>Legal</h4>
          <a href="/privacy-policy.html">Privacy Policy</a>
        </div>
      </div>
    </div>
  <div class="container footer-bottom"><p class="footer-note">Made for a little more play.</p><div class="theme-control"><div class="theme-buttons" role="group" aria-label="Color theme"><button type="button" data-theme-choice="light" aria-label="Light" title="Light" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><button type="button" data-theme-choice="system" aria-label="System" title="System theme" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M9 21h6m-3-4v4"/></svg></button><button type="button" data-theme-choice="dark" aria-label="Dark" title="Dark" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 13A9 9 0 0 1 11 3.2 9 9 0 1 0 20.8 13Z"/></svg></button></div></div></div>
  </footer>
</body>
</html>
